[project]
name = "gh-ci"
version = "0.1.0"
description = "CLI to make agents better at watching GitHub CI"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pytimeparse2>=1.7",
    "platformdirs>=4.0",
]

[project.scripts]
gh-ci = "ghci.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghci"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-subprocess>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
